<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maidenhead Grid to GPS Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Maidenhead Grid to GPS Converter</h1>
    <p>Enter a 4-10 character Maidenhead Grid Square:</p>
    <input type="text" id="gridInput" placeholder="e.g. FN31pr" maxlength="10">
    <button onclick="convertGrid()">Convert to GPS</button>

    <div id="result"></div>
    
    <script>
        const GRID_RE = /^[A-R]{2}[0-9]{2}(?:[A-X]{2}(?:[0-9]{2}(?:[A-X]{2})?)?)?$/;

        // Returns the center of the grid square, accepting either letter case.
        function gridToLatLon(grid) {
            grid = grid.toUpperCase();
            const letter = i => grid.charCodeAt(i) - 65;
            const digit = i => grid.charCodeAt(i) - 48;

            // Size of each pair's cell in degrees: [lon, lat]
            const steps = [[20, 10], [2, 1], [2 / 24, 1 / 24], [2 / 240, 1 / 240], [2 / 5760, 1 / 5760]];
            let lon = -180, lat = -90;
            const pairs = grid.length / 2;
            for (let p = 0; p < pairs; p++) {
                const read = p % 2 === 0 ? letter : digit;
                lon += read(2 * p) * steps[p][0];
                lat += read(2 * p + 1) * steps[p][1];
            }
            lon += steps[pairs - 1][0] / 2;
            lat += steps[pairs - 1][1] / 2;
            return [lat, lon];
        }

        function convertGrid() {
            const grid = document.getElementById('gridInput').value.trim();
            if (!GRID_RE.test(grid.toUpperCase())) {
                document.getElementById('result').textContent =
                    'Invalid grid square: use 4, 6, 8 or 10 characters, e.g. FN31 or FN31pr.';
                return;
            }

            const [lat, lon] = gridToLatLon(grid);

            const gpsCoords = `Latitude: ${lat.toFixed(6)}, Longitude: ${lon.toFixed(6)}`;
            const googleMapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

            document.getElementById('result').innerHTML = `
                <p>${gpsCoords}</p>
                <a href="${googleMapsLink}" target="_blank">View on Google Maps</a>
            `;
        }
    </script>
</body>
</html>
